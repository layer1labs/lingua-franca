name: Chrono target proof

# End-to-end proof for the Chrono LF target (see chrono-proof/README.md).
# The sandbox where this branch was developed cannot run Gradle (daemon
# IPC failure, evidence in chrono-proof/gradle-daemon-blocker*.log), so
# the real build + proof run here, on a clean GitHub-hosted machine.
#
# The proof script needs the chronohive worktree (chronoc sources + the
# Python reader). That repo is private and deploy keys are disabled on
# it, so it is checked out with a cross-repo token secret.

on:
  push:
    branches: [chrono-target]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out lingua-franca (chrono-target)
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check out the chronohive worktree (chronoc + Python reader)
        uses: actions/checkout@v4
        with:
          repository: layer1labs/chronohive
          ref: feat/blob-lf-target
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: chronohive-wt

      - name: Recreate the harness source path used in the sandbox
        run: |
          sudo mkdir -p /home/hatch/workspace
          sudo ln -s "$GITHUB_WORKSPACE/chronohive-wt" \
            /home/hatch/workspace/chronohive-wt-target
          ls /home/hatch/workspace/chronohive-wt-target/toolchain/chronoc/src

      - name: Build lfc (root assemble installs build/install/lf-cli)
        run: ./gradlew assemble --console=plain

      - name: Run the Chrono end-to-end proof
        env:
          CHRONOHIVE_WT: ${{ github.workspace }}/chronohive-wt
        run: bash chrono-proof/scripts/proof.sh

  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out lingua-franca (chrono-target)
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: spotlessCheck
        run: ./gradlew spotlessCheck --console=plain

  spotless-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out lingua-franca (chrono-target)
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: spotlessApply
        run: ./gradlew spotlessApply --console=plain

      - name: Commit formatting fixes, if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Run spotlessApply [skip ci]"
            git push
          else
            echo "spotlessApply produced no changes"
          fi
